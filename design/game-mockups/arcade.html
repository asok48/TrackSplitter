<!doctype html><meta charset="utf-8"><title>Encore arcade mode</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Arcade mode, premium (user, after note-styles.html: "the shatter and score popup are distracting and repeated notes
     are hard to read", "make it more premium", "the energy around the game could use improving"; and on joining repeats
     with a line: "the line to me means hold the note"). Flow: the cursor stays put and the flat tab glides under it at
     one steady speed. Numbers on dark keycaps; a repeat shows its number again, smaller and lighter, never joined by a
     line (a line is only ever a held note). The energy is around the track, not on it: light pools, edge glow, dust,
     a sweep at streak milestones, all following a simulated streak. Real passages from the user's imported tabs. -->
<style>
:root{color-scheme:dark}

canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;top:14px;left:18px;right:18px;z-index:2;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font:600 12.5px -apple-system,system-ui}
.bar b{font:700 15px -apple-system,"SF Pro Display",system-ui;letter-spacing:.02em;margin-right:6px}
.bar button{border:0;background:none;padding:3px 0;color:rgba(245,245,247,.45);font:inherit;cursor:pointer;border-bottom:1.5px solid transparent}
.bar button.on{color:#fff;border-bottom-color:rgba(255,255,255,.7)}
.bar .sep{width:1px;height:14px;background:rgba(255,255,255,.15)}
.bar label{display:flex;gap:8px;align-items:center;color:rgba(245,245,247,.6)}
.bar input[type=range]{width:100px;accent-color:#e5e5ea}
.note{position:fixed;left:18px;bottom:14px;z-index:2;color:rgba(245,245,247,.38);font-size:12px}
</style>

</div>
<div class="note">Space pauses · the streak builds as the passage plays (every note counts as hit) · x2 at 10, x3 at 20, x4 at 30 · Some misses: every 13th note missed (streak resets) · Use my bass: pluck to move the string</div>
<script src="note-styles-data.js"></script>
<script>
const COL=['#6ee7a8','#f8a1a1','#f6d878','#8fb8fa'],NAMES=['E','A','D','G'];   // softer than the game's lane colours
const FONT='-apple-system,"SF Pro Display",system-ui,sans-serif';
const MOOD={1:['#f5e6d3','#c08457'],2:['#fcd34d','#f59e0b'],3:['#fb923c','#e11d48'],4:['#7dd3fc','#6366f1']};   // per multiplier: [light, deep]
const NW=0.56,VIS=17.5;
const cv=document.getElementById('cv'),g=cv.getContext('2d');
let W=0,H=0,clock=0,last=performance.now(),paused=false,spread=true,speedSet=0.7,size=0.75,   // smaller numbers by default (user: "it's easier to read when the numbers aren't huge")
 song=Object.keys(PASSAGES)[1];
let notes,bars,warp,info,mood={c:[245,230,211],d:[192,132,87]},sweepAt=-9,lastMult=1;
let holdStyle='glass',scoreLook='plaque',mileN=0,mileAt=-9,award2='records',recTier=0,recAt=-9,hudStyle='row',stagger='stem',x4k=0,songFit=1,bgStyle='mesh',dens=new Float32Array(1),repSize=0.7,repStyle='echoes',echo='diamond';
// Alive (user: "I would like it to look more alive somehow", picked 1-3 of the ideas): Live strings (the played string
// vibrates as long as the note rings, harder on a harder pluck; with "Use my bass" it follows the input's level; replaces
// String wave while on), Trail (each hit note leaves a glow that slides off with the tab; a miss leaves none and goes
// grey), Light pass (a hit sends light along to the next note, which then glows inside until you play it)
// The user's setup (2026-11-07): Light pass To the next note. Then ("the strings shaking could use some work", "I like the
// idea of something bouncing between the notes being hit"): string styles (Ripple / Hum / Blur / Shake) and Bounce
// Polish (user: "I just feel like we could visually make it look overall better" -> "Yes, mock up"): each its own switch, off
// to start so they can be compared: Glass, Keycaps, Spotlight, Real strings, Borderless
const pol={glass:false,keys:false,spot:false,strings:false,float:false};
let bPath='straight',bShape='electric',passStyle='next',liveStyle='ripple',bounceLead='travel',   // user: "it would look cooler if it was traveling with the notes and maybe be a bit less distracting"
missed=new Set(),mic=null,tNow=0;
const fx={behind:true,press:true,react:true,live:true,trail:true,pass:true,misses:false,x4:false,outline:true,glint:false,rings:true,sparks:true,wave:true,pools:true,edges:false,dust:false,sweep:true,hud:true};   // rings / sparks / wave: the arcade feel back (user: "I also liked the more arcade feel it had before when playing")

function makeWarp(base,need){                  // spread fast runs (as in note-styles.html); need = board units between distinct notes on a string
 const step=0.01,T=26,want=new Float32Array(Math.ceil(T/step)).fill(1),lastOn={};
 for(const n of notes){const p=lastOn[n[2]];if(p&&p[3]!==n[3]){const gap=n[0]-p[0];if(gap>0.03){const s=Math.min(1.35,Math.max(1,need/(gap*base)));for(let i=Math.floor(p[0]/step);i<n[0]/step&&i<want.length;i++)want[i]=Math.max(want[i],s)}}lastOn[n[2]]=n}
 const R=80,held=new Float32Array(want.length),sm=new Float32Array(want.length);   // held and eased over ±0.8 s: speed changes stay gentle (at up to 3.5x "it's hard to read when it speeds up super fast")
 for(let i=0;i<want.length;i++){let m=1;for(let j=Math.max(0,i-R);j<=Math.min(want.length-1,i+R);j++)m=Math.max(m,want[j]);held[i]=m}
 for(let i=0;i<want.length;i++){let a=0,c=0;for(let j=Math.max(0,i-R);j<=Math.min(want.length-1,i+R);j++){a+=held[j];c++}sm[i]=a/c}
 const cum=new Float32Array(want.length+1);for(let i=0;i<want.length;i++)cum[i+1]=cum[i]+sm[i]*base*step;
 return t=>{const x=Math.max(0,Math.min(want.length-1,t/step)),i=Math.floor(x);return cum[i]+(cum[i+1]-cum[i])*(x-i)+(t<0?t*base:0)};
}
function load(){
 ({notes,bars}=PASSAGES[song]);
 const base=VIS/(3.4/speedSet);
 const unitPx=(W*0.88)/(VIS*1.25),capPx=Math.min(H*0.3,250)/4*0.6*size*1.15+10;   // room for a keycap (not the game's narrower note)
 warp=spread?makeWarp(base,Math.max(NW+0.6,capPx/unitPx)):(t=>t*base);
 // per note: repeat (below), where the next
 // note on its string starts (a held note's line stops there), and the running score
 dens=new Float32Array(Math.ceil(26/0.05));for(const n of notes){for(let i=Math.max(0,Math.round((n[0]-0.6)/0.05));i<=Math.round((n[0]+0.6)/0.05)&&i<dens.length;i++)dens[i]+=Math.exp(-((((i*0.05)-n[0])/0.35)**2))}   // how busy, smoothed
 {let mx=0;for(const v of dens)mx=Math.max(mx,v);if(mx)for(let i=0;i<dens.length;i++)dens[i]/=mx}
 info=new Map();const prev={};let score=0;
 // a repeat is the game's: the very next note played (notes struck together skipped), same string and fret, within 2.5 s
 // (user: "it says notes are repeats when they are not": A5 E0 A5 had counted, comparing only within a string)
 notes.forEach((n,i)=>{const p=prev[n[2]];let pk=i-1;while(pk>=0&&n[0]-notes[pk][0]<0.03&&notes[pk][2]!==n[2])pk--;
  const q=pk>=0?notes[pk]:null,rep=!!q&&q[2]===n[2]&&q[3]===n[3]&&n[0]-q[0]<2.5;const repN=rep?(info.get(q).repN||0)+1:0;prev[n[2]]=n;const mult=Math.min(4,1+Math.floor(i/10));score+=50*mult;info.set(n,{rep,repN,i,mult,score,next:Infinity,prev:p?p[0]:-Infinity})});
 const after={},afterN={};let nxt=null;for(let k=notes.length-1;k>=0;k--){const n=notes[k],I=info.get(n);I.next=after[n[2]]??Infinity;I.nextN=afterN[n[2]]||null;after[n[2]]=n[0];afterN[n[2]]=n;
  I.after=nxt;if(!nxt||k===0||n[0]-notes[k-1][0]>=0.03)nxt=n}   // after: the next note in time (a chord's notes share one)
 missed=new Set(fx.misses?notes.filter((n,i)=>i%13===12):[]);   // Some misses: every 13th note missed
 // one note size for the whole song (user: "the changing note sizes is tough"): small enough that 80% of the gaps between
 // numbered notes on a string fit a keycap with 8 px to spare (not below 80%); the rest lose their keycap, not their size
 {const fs0=Math.min(H*0.3,250)/4*0.6*size,ux=(W*0.97-Math.max(W*0.09,96))/(VIS*1.25),gaps=[];
  for(const n of notes){const I=info.get(n);if(!I.rep&&I.prev>-Infinity)gaps.push((warp(n[0])-warp(I.prev))*ux)}
  gaps.sort((a,b)=>a-b);const p20=gaps.length?gaps[Math.floor(gaps.length*0.2)]:1e9;songFit=Math.max(0.8,Math.min(1,(p20-8)/(fs0*1.15)))}   // 80% of gaps, not below 80% (at 90% / 60% Flower Power Madness came out tiny)
}
function resize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',()=>{resize();if(notes)load()});resize();
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),css=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const missedColor=(n,c)=>missed.has(n)&&tNow-n[0]>0.12?[110,112,120]:c;   // a missed note greys out once it's past
const glowIn=(x,y,w,c,pr)=>{const q=g.createRadialGradient(x,y,0,x,y,w*0.6);q.addColorStop(0,css(c,0.45*pr));q.addColorStop(1,css(c,0.08*pr));g.fillStyle=q;g.fill()};   // Light pass: the keycap lit inside (its path still set)
const hudGap=()=>hudStyle==='center'?92:24;   // where a milestone shows: above the score group when centred
const ease=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
function soft(x,y,r,c,a){const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,css(c,a));q.addColorStop(1,css(c,0));g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2)}

// a fixed field of dust motes (x 0-1, y 0-1, depth)
const MESH=Object.assign(document.createElement('canvas'),{width:48,height:30});let meshT=0,busyAvg=0;
const BOKEH=Array.from({length:14},(_,i)=>({x:((i*0.618+0.1)%1),y:0.06+((i*0.437)%1)*0.88,r:0.05+((i*0.29)%1)*0.11,a:0.5+((i*0.71)%1)*0.5,s:0.5+(i%3)*0.4,p:i*1.7,k:i%2}));
const GRAIN=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),d=x.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);return g.createPattern(c,'repeat')})();
const DUST=Array.from({length:70},(_,i)=>({x:(i*0.618)%1,y:((i*0.371)%1),z:0.3+((i*0.53)%1)*0.7,r:0.6+((i*0.29)%1)*1.4}));

function frame(ms){
 const dt=Math.min(0.05,(ms-last)/1000);if(!paused)clock+=(ms-last)/1000;last=ms;
 const t=clock%24;
 // streak so far (every note counts as hit), the multiplier, and the mood easing toward its colours
 let k=-1,lm=-1;for(let i=0;i<notes.length&&notes[i][0]<=t;i++){k=i;if(missed.has(notes[i]))lm=i}
 tNow=t;
 const streak=k-lm,score=k>=0?info.get(notes[k]).score:0;let mult=Math.min(4,1+Math.floor(streak/10));
 if(fx.x4)mult=4;                                  // the x4 preview
 x4k+=((mult===4?1:0)-x4k)*Math.min(1,dt/0.5*3);  // x4 fades in and out over about half a second
 if(mult>lastMult&&fx.sweep)sweepAt=clock;lastMult=mult;
 const [mc,md]=MOOD[mult].map(rgb);mood.c=ease(mood.c,mc,0.04);mood.d=ease(mood.d,md,0.04);
 const heat=fx.x4?1:Math.min(1,streak/30);                // 0 calm -> 1 at x4
 const ed=[...bars];if(ed[0]>0.05)ed.unshift(ed[0]-(ed[1]-ed[0]));
 const barLen=ed[1]-ed[0],beatLen=barLen/4,ph=((t-ed[0])/beatLen)%1,beatN=Math.floor((t-ed[0])/beatLen)%4;
 const beat=Math.exp(-Math.max(0,ph)*6)*(beatN===0?1:0.5);
 // how busy the music is right now (notes in the last second): the surroundings breathe with it
 let busy=0;for(const n of notes)if(n[0]<=t&&n[0]>t-1)busy++;busy=Math.min(1,busy/8);

 // ---- around the track ----
 const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#05060a');bg.addColorStop(1,'#0a0b12');g.fillStyle=bg;g.fillRect(0,0,W,H);
 const trackT=H*0.36,trackH=Math.min(H*0.3,250),trackB=trackT+trackH,L=Math.max(W*0.09,96),R=W*0.97,curX=L+(R-L)*0.2;
 // Backgrounds (user: "how could we make the background better?"; the song's cover behind and cone-shaped beams were
 // turned down for the 3D board): Pools, Stage (rows of out-of-focus lights at three depths, flashing in turn on the beats,
 // a wave chasing across at each bar), Aurora (slow ribbons of light), Landscape (a silhouette of how busy the song is,
 // scrolling with the tab, so busy stretches show coming).
 const lift=0.05+0.1*heat+0.06*busy+0.05*beat;
 if(fx.pools&&bgStyle==='mesh'){                  // a mesh of colour (user: "still looks cheap", "I want it to be dynamic with the song")
  // a few huge colour clouds drawn on a tiny canvas and stretched over the screen: blurred past any visible edge.
  // Driven by the song: brighter on each beat (beat 1 most), brighter and drifting faster when the music is busy, the
  // colours trading places every 4 bars, a swell when it suddenly gets busier (a chorus coming in); colours from the
  // multiplier. In the game these would come from the song's own light cues (kicks, snares, loudness, big moments).
  const m=MESH.getContext('2d'),mw=MESH.width,mh=MESH.height;
  meshT+=(1/60)*(0.2+0.6*busy);                   // drift faster when busy
  busyAvg+=(busy-busyAvg)*0.01;const swell=Math.max(0,busy-busyAvg-0.15)*1.6;
  const phrase=Math.floor((t-ed[0])/(barLen*4)),pk=Math.min(1,(((t-ed[0])/(barLen*4))%1)*4);   // the 4-bar phrase, the first bar easing in
  const cols=[mood.c,mood.d,ease(mood.c,mood.d,0.5),ease(mood.d,[20,20,40],0.4)];
  m.fillStyle='#05060a';m.fillRect(0,0,mw,mh);m.globalCompositeOperation='lighter';
  for(let i=0;i<4;i++){const ci=(i+phrase)%4,cn=(i+phrase+1)%4,c3=ease(cols[ci],cols[cn],1-pk);
   const x=mw*(0.5+0.38*Math.sin(meshT*(0.21+i*0.07)+i*1.9)),y=mh*(0.5+0.36*Math.cos(meshT*(0.17+i*0.05)+i*2.7)),r=mw*(0.42+0.08*Math.sin(meshT*0.3+i));
   const a=Math.min(1,0.16+0.16*busy+0.05*beat+0.14*swell+0.06*heat)*(i===3?0.6:1);   // calmer (user: "a bit too flashy")
   const q=m.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,css(c3,a));q.addColorStop(1,css(c3,0));m.fillStyle=q;m.fillRect(0,0,mw,mh)}
  m.globalCompositeOperation='source-over';
  g.save();g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.globalAlpha=0.7;g.drawImage(MESH,0,0,W,H);g.restore();
  g.fillStyle='rgba(5,6,10,.42)';g.fillRect(0,0,W,H);   // keep it deep, not bright
 }
 if(fx.pools&&bgStyle==='studio'){                // premium (user: "I want it to look premium"): soft layers, nothing hard-edged
  let q=g.createRadialGradient(W*0.5,-H*0.25,0,W*0.5,-H*0.25,H*1.5);q.addColorStop(0,css(mood.d,0.13+0.07*heat));q.addColorStop(1,css(mood.d,0));g.fillStyle=q;g.fillRect(0,0,W,H);
  g.save();g.globalCompositeOperation='lighter';
  for(const b of BOKEH){const x=b.x*W+Math.sin(clock*0.05*b.s+b.p)*W*0.015,y=b.y*H+Math.cos(clock*0.04*b.s+b.p)*H*0.01,r=b.r*H,c3=b.k?mood.c:mood.d,a=(0.03+0.03*heat+0.015*beat)*b.a;
   const bq=g.createRadialGradient(x,y,0,x,y,r);bq.addColorStop(0,css(c3,a*0.55));bq.addColorStop(0.82,css(c3,a*0.75));bq.addColorStop(0.92,css(c3,a));bq.addColorStop(1,css(c3,0));   // a lens blur: flat inside, a faint rim
   g.fillStyle=bq;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
  g.restore();
  q=g.createLinearGradient(0,trackT-H*0.12,0,trackB+H*0.12);q.addColorStop(0,css(mood.c,0));q.addColorStop(0.5,css(mood.c,0.05+0.03*beat));q.addColorStop(1,css(mood.c,0));g.fillStyle=q;g.fillRect(0,trackT-H*0.12,W,trackB-trackT+H*0.24);   // haze behind the track
  g.save();g.translate(W*0.5,trackB+H*0.13);g.scale(1,0.22);soft(0,0,W*0.45,mood.c,0.07+0.05*heat);g.restore();   // the track's light on a polished floor
 }

   g.save();g.beginPath();for(let j=0;j<10;j++){const a=-Math.PI/2+j*Math.PI/5,r0=j%2?ss*0.22:ss/2;g.lineTo(cx0+Math.cos(a)*r0,cy+Math.sin(a)*r0)}g.closePath();
   g.fillStyle='rgba(255,245,230,0.22)';g.fill();g.clip();if(f>0){g.fillStyle='#f5b70a';g.shadowColor='rgba(245,183,10,0.6)';g.shadowBlur=f>=1?8:0;g.fillRect(cx0-ss/2,cy-ss/2,ss*f,ss)}g.restore()}};
  // Records instead of stars (user: "how about instead of doing stars, we do records? bronze/silver/gold/platinum/diamond?"):
  // the 5 star levels as Bronze / Silver / Gold / Platinum / Diamond; a vinyl with the tier's colour on its label, a thin
  // ring filling toward the next tier, the tier's name beside it; a pop and a shine across it when a tier is reached.
  // A premium record (user: "refine the look of the record, make it look more premium"): vinyl with fine grooves, a soft
  // reflection turning slowly as if it spins, a thin bright edge; the label in the tier's metal (copper, brushed silver,
  // warm gold, cool platinum, pearly diamond) with a highlight; the tier in small spaced capitals; a fine progress ring.
  const TIERS=[['NO RECORD YET',['#2e2e36','#4a4a55','#2e2e36']],['BRONZE',['#6b3a16','#c97f42','#7d4620']],['SILVER',['#737b86','#d9dee5','#858d98']],
               ['GOLD',['#8a5c03','#efc244','#a06c06']],['PLATINUM',['#9aa4b0','#e8edf2','#b0b9c3']],['DIAMOND',['#4fa9de','#cdeeff','#9b8cec']]];   // richer metals (the first ones read almost silver)
  // The whole record in the tier's metal (user: "I'd like the whole record to be the color and then the progress fills with
  // the new color"): the next tier's metal sweeps round the disc like a clock hand as you get closer (no separate ring).
  const record=(x,cy,align,rBase=17,showName=true)=>{const tier=Math.min(5,Math.floor(val)),frac=tier>=5?0:val-tier,[name,mt]=TIERS[tier],nm=TIERS[Math.min(5,tier+1)][1];
   if(tier!==recTier){if(tier>recTier)recAt=clock;recTier=tier}
   if(clock<recAt)recAt=-9;   // time went back (the loop, a jump): no pop from the future (the record had swelled huge)
   const pop=1+0.25*Math.max(0,1-(clock-recAt)/0.35),r=rBase*pop,cx=align==='center'?x:x+r+4;
   const metal=(m)=>{const q=g.createLinearGradient(-r,-r,r,r);q.addColorStop(0,m[0]);q.addColorStop(0.5,m[1]);q.addColorStop(1,m[2]);return q};
   g.save();g.translate(cx,cy);
   g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=8;g.shadowOffsetY=2;g.beginPath();g.arc(0,0,r,0,7);g.fillStyle=metal(mt);g.fill();g.shadowBlur=0;g.shadowOffsetY=0;
   // the next tier filling in (user: "the next color should be easy to see and get color as you get more"): faint at first,
   // more solid as it grows; its vivid accent traced round the rim with a glow so even a little progress shows
   const VIVID=['#ff9a52','#eef4ff','#ffcf33','#cfe3ff','#5fd0ff'],vc=VIVID[Math.min(4,tier)],ang=-Math.PI/2+Math.PI*2*frac;
   if(frac>0){g.save();g.globalAlpha=0.35+0.65*frac;g.beginPath();g.moveTo(0,0);g.arc(0,0,r,-Math.PI/2,ang);g.closePath();g.fillStyle=metal(nm);g.fill();
    g.globalAlpha=0.12+0.25*frac;g.fillStyle=vc;g.fill();g.restore();   // tinted with its accent, more as it grows
    g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(ang)*r,Math.sin(ang)*r);g.strokeStyle=vc;g.globalAlpha=0.8;g.lineWidth=1.2;g.stroke();g.globalAlpha=1}   // its leading edge
   for(let i=0;i<9;i++){const rr=r*(0.5+i*0.055);g.beginPath();g.arc(0,0,rr,0,7);g.strokeStyle=i%2?'rgba(0,0,0,.14)':'rgba(255,255,255,.12)';g.lineWidth=0.6;g.stroke()}   // grooves
   g.save();g.beginPath();g.arc(0,0,r,0,7);g.clip();g.rotate(clock*0.8);   // a reflection, turning as if it spins
   for(const k of[0,Math.PI]){g.save();g.rotate(k);const q=g.createLinearGradient(-r*0.2,-r,r*0.2,-r);q.addColorStop(0,'rgba(255,255,255,0)');q.addColorStop(0.5,'rgba(255,255,255,.28)');q.addColorStop(1,'rgba(255,255,255,0)');
    g.beginPath();g.moveTo(0,0);g.arc(0,0,r,-Math.PI/2-0.3,-Math.PI/2+0.3);g.closePath();g.fillStyle=q;g.fill();g.restore()}
   g.restore();
   g.beginPath();g.arc(0,0,r-0.5,0,7);g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1;g.stroke();   // the bright edge
   if(frac>0){g.save();g.beginPath();g.arc(0,0,r+3,-Math.PI/2,ang);g.strokeStyle=vc;g.lineWidth=2.5;g.lineCap='round';g.shadowColor=vc;g.shadowBlur=8;g.globalAlpha=0.65+0.35*frac;g.stroke();g.restore()}   // the accent arc round the rim
   g.beginPath();g.arc(0,0,r*0.36,0,7);g.fillStyle='rgba(0,0,0,.22)';g.fill();g.strokeStyle='rgba(255,255,255,.3)';g.lineWidth=0.7;g.stroke();   // the label, a shade deeper
   g.fillStyle='#050506';g.beginPath();g.arc(0,0,r*0.07,0,7);g.fill();   // the spindle hole
   if(tier===5){const sp4=(px,py,k,z)=>{g.fillStyle='rgba(255,255,255,'+(0.4+0.6*Math.max(0,Math.sin(clock*4+k)))+')';g.beginPath();g.moveTo(px,py-z);g.lineTo(px+z*0.28,py-z*0.28);g.lineTo(px+z,py);g.lineTo(px+z*0.28,py+z*0.28);g.lineTo(px,py+z);g.lineTo(px-z*0.28,py+z*0.28);g.lineTo(px-z,py);g.lineTo(px-z*0.28,py-z*0.28);g.closePath();g.fill()};sp4(r*0.78,-r*0.78,0,4.5);sp4(-r*0.85,r*0.55,2.2,3)}
   const sa=(clock-recAt)/0.7;if(sa>=0&&sa<1){g.save();g.beginPath();g.arc(0,0,r,0,7);g.clip();const sx=-r*1.4+2.8*r*sa,q=g.createLinearGradient(sx-7,-r,sx+7,r);q.addColorStop(0,'rgba(255,255,255,0)');q.addColorStop(0.5,'rgba(255,255,255,.6)');q.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=q;g.fillRect(-r,-r,2*r,2*r);g.restore()}
   g.restore();
   if(!showName)return;g.font=`600 10.5px ${FONT}`;g.letterSpacing='2.2px';g.textBaseline='middle';g.fillStyle=tier?mt[1]:'rgba(245,245,247,.4)';
   if(align==='center'){g.textAlign='center';g.fillText(name,cx,cy+r+15)}else{g.textAlign='left';g.fillText(name,cx+r+12,cy)}g.letterSpacing='0px'};
  const award=(x,cy,align)=>award2==='records'?record(x,cy,align):stars(align==='center'?x-2*(ss+5):x,cy);
  const sc=score.toLocaleString();
  // Plaque (user: "I think the score and record could look better"): one unit, the record as its emblem (26 px), the score
  // beside it in light type with a soft silver gradient, the tier under the score in its own metal after a short rule.
  const plaque=(x0,ym,align)=>{
   const tier=Math.min(5,Math.floor(val)),[name,mt]=TIERS[tier],R0=26;g.font=`200 48px ${FONT}`;const sw=g.measureText(sc).width;
   g.font=`600 10.5px ${FONT}`;g.letterSpacing='2.4px';const label=tier?name+' RECORD':name,lw=g.measureText(label).width+22;g.letterSpacing='0px';
   const w=2*R0+20+Math.max(sw,lw),left=align==='center'?x0-w/2:x0,tx=left+2*R0+20;
   record(left-4,ym,'left',R0,false);
   const q=g.createLinearGradient(0,ym-34,0,ym+4);q.addColorStop(0,'#ffffff');q.addColorStop(1,'#c3c9d2');
   g.font=`200 48px ${FONT}`;g.textAlign='left';g.textBaseline='alphabetic';g.fillStyle=q;g.fillText(sc,tx,ym+4);
   const ly=ym+20;g.fillStyle=tier?mt[1]:'rgba(245,245,247,.35)';g.fillRect(tx,ly-0.5,14,1);
   g.font=`600 10.5px ${FONT}`;g.letterSpacing='2.4px';g.textBaseline='middle';g.fillText(label,tx+22,ly);g.letterSpacing='0px'};
  if(scoreLook==='plaque'&&award2==='records'){
   if(hudStyle==='center')plaque((hl+hr)/2,trackT-pad-48,'center');else plaque(hl,hudStyle==='row'?trackT-pad-48:trackB+pad+50,'left');
  }else if(hudStyle==='row'||hudStyle==='below'){
   const hb=hudStyle==='row'?trackT-pad-44:trackB+pad+62;   // row: the stars under the score (beside it they ran into the cursor's badge)
   g.textAlign='left';g.textBaseline='alphabetic';g.font=`300 52px ${FONT}`;g.fillStyle='#f5f5f7';g.fillText(sc,hl,hb);const scW=g.measureText(sc).width;if(hudStyle==='row')award(hl+2,hb+22,'left');else award(hl+scW+26,hb-14,'left');
   // (no streak shown: user, "I don't want to show the streak, but show something at 50/100/150")
  }else{                                           // centre: one group over the middle of the track
   const cx=(hl+hr)/2,hb=trackT-pad-44;
   g.textAlign='center';g.textBaseline='alphabetic';g.font=`300 46px ${FONT}`;g.fillStyle='#f5f5f7';g.fillText(sc,cx,hb);const scW=g.measureText(sc).width;
   award(cx,hb+32,'center');

  }
 }
 // Milestones every 50 notes (user: "I don't want to show the streak, but show something at 50/100/150/etc"): a large light
 // number over the middle of the track, NOTE STREAK under it, thin lines drawing out to each side; ~1.6 s.
 {if(clock<mileAt)mileAt=-9;const m50=Math.floor(streak/50)*50;if(m50>mileN){mileN=m50;mileAt=clock}if(streak<mileN)mileN=Math.floor(streak/50)*50;
  const ma=clock-mileAt;if(mileN>0&&ma>=0&&ma<1.6){const pw=R-L+56+pad,cx=L-56+pw/2,cy=trackT-pad-hudGap(),a=Math.min(1,ma/0.18)*Math.min(1,(1.6-ma)/0.45),sc=0.92+0.08*Math.min(1,ma/0.25);
   g.save();g.globalAlpha=a;g.translate(cx,cy);g.scale(sc,sc);g.textAlign='center';g.textBaseline='alphabetic';g.font=`200 46px ${FONT}`;g.fillStyle=css(mood.c,1);g.fillText(String(mileN),0,0);
   const nw=g.measureText(String(mileN)).width,ext=Math.min(1,ma/0.5)*110;g.strokeStyle=css(mood.c,0.7);g.lineWidth=1;
   g.beginPath();g.moveTo(-nw/2-14,-14);g.lineTo(-nw/2-14-ext,-14);g.moveTo(nw/2+14,-14);g.lineTo(nw/2+14+ext,-14);g.stroke();
   g.font=`600 10px ${FONT}`;g.letterSpacing='3px';g.fillStyle='rgba(245,245,247,.7)';g.fillText('NOTE STREAK',0,16);g.letterSpacing='0px';g.restore()}}
 requestAnimationFrame(frame);
}

// controls
const bar=document.getElementById('bar');
document.getElementById('songs').innerHTML=Object.keys(PASSAGES).map(s=>`<button data-song="${s}">${s}</button>`).join(' ');
function show(){
 bar.querySelectorAll('[data-song]').forEach(b=>b.classList.toggle('on',b.dataset.song===song));
 bar.querySelectorAll('[data-look2]').forEach(b=>b.classList.toggle('on',b.dataset.look2===scoreLook));
 bar.querySelectorAll('[data-award]').forEach(b=>b.classList.toggle('on',b.dataset.award===award2));
 bar.querySelectorAll('[data-hud]').forEach(b=>b.classList.toggle('on',b.dataset.hud===hudStyle));
 bar.querySelectorAll('[data-stagger]').forEach(b=>b.classList.toggle('on',b.dataset.stagger===stagger));
 bar.querySelectorAll('[data-hold]').forEach(b=>b.classList.toggle('on',b.dataset.hold===holdStyle));
 bar.querySelectorAll('[data-bg]').forEach(b=>b.classList.toggle('on',b.dataset.bg===bgStyle));
 bar.querySelectorAll('[data-rep]').forEach(b=>b.classList.toggle('on',b.dataset.rep===repStyle));
 document.getElementById('echo-bar').style.display=repStyle==='echoes'?'contents':'none';
 bar.querySelectorAll('[data-echo]').forEach(b=>b.classList.toggle('on',b.dataset.echo===echo));
 bar.querySelectorAll('[data-fx]').forEach(b=>b.classList.toggle('on',fx[b.dataset.fx]));
 bar.querySelectorAll('[data-pass]').forEach(b=>b.classList.toggle('on',b.dataset.pass===passStyle));
 document.getElementById('pass-bar').style.display=fx.pass?'contents':'none';
 document.getElementById('lead-bar').style.display=passStyle==='bounce'?'contents':'none';
 document.getElementById('live-bar').style.display=fx.live?'contents':'none';
 bar.querySelectorAll('[data-pol]').forEach(b=>b.classList.toggle('on',b.dataset.pol==='all'?Object.values(pol).every(Boolean):pol[b.dataset.pol]));
 bar.querySelectorAll('[data-bpath]').forEach(b=>b.classList.toggle('on',b.dataset.bpath===bPath));
 bar.querySelectorAll('[data-bshape]').forEach(b=>b.classList.toggle('on',b.dataset.bshape===bShape));
 bar.querySelectorAll('[data-lead]').forEach(b=>b.classList.toggle('on',b.dataset.lead===bounceLead));
 bar.querySelectorAll('[data-lstyle]').forEach(b=>b.classList.toggle('on',b.dataset.lstyle===liveStyle));
 bar.querySelector('[data-mic]').classList.toggle('on',!!mic);
 bar.querySelector('[data-spread]').classList.toggle('on',spread);
 bar.querySelector('[data-pause]').textContent=paused?'Play':'Pause';
}
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.look2)scoreLook=b.dataset.look2;else if(b.dataset.award)award2=b.dataset.award;else if(b.dataset.hud)hudStyle=b.dataset.hud;else if(b.dataset.stagger)stagger=b.dataset.stagger;else if(b.dataset.hold)holdStyle=b.dataset.hold;else if(b.dataset.bg)bgStyle=b.dataset.bg;else if(b.dataset.echo)echo=b.dataset.echo;else if(b.dataset.rep)repStyle=b.dataset.rep;else if(b.dataset.pass)passStyle=b.dataset.pass;else if(b.dataset.lead)bounceLead=b.dataset.lead;else if(b.dataset.bshape)bShape=b.dataset.bshape;else if(b.dataset.bpath)bPath=b.dataset.bpath;else if(b.dataset.pol){if(b.dataset.pol==='all'){const on=!Object.values(pol).every(Boolean);for(const k in pol)pol[k]=on}else pol[b.dataset.pol]=!pol[b.dataset.pol]}else if(b.dataset.lstyle)liveStyle=b.dataset.lstyle;else if('mic' in b.dataset){toggleMic();return}else if(b.dataset.song){song=b.dataset.song;clock=0;load()}else if(b.dataset.fx){fx[b.dataset.fx]=!fx[b.dataset.fx];if(b.dataset.fx==='misses')load()}else if('spread' in b.dataset){spread=!spread;load()}else if('pause' in b.dataset)paused=!paused;show()});
// Use my bass: the input's level drives Live strings (on the string the tab played last; the game would use the detected string)
async function toggleMic(){
 if(mic){mic.stream.getTracks().forEach(x=>x.stop());mic.ctx.close();mic=null;show();return}
 try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const ctx=new AudioContext(),an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);mic={stream,ctx,an,buf:new Float32Array(1024),lvl:0,pluckAt:-9};fx.live=true}
 catch(e){alert('Couldn\'t open the input: '+e.message)}
 show()}
addEventListener('keydown',e=>{if(e.key===' '){paused=!paused;e.preventDefault();show()}});
const sp=document.getElementById('speed');sp.oninput=()=>{speedSet=+sp.value;document.getElementById('speedv').textContent=speedSet+'×';load()};
const sz=document.getElementById('size');sz.oninput=()=>{size=+sz.value;document.getElementById('sizev').textContent=size+'×';load()};
const rs=document.getElementById('repsize');rs.oninput=()=>{repSize=+rs.value;document.getElementById('repsizev').textContent=repSize+'×'};
const qs=new URLSearchParams(location.search);if(qs.get('t'))clock=+qs.get('t');if(qs.get('pause'))paused=true;if(qs.get('x4'))fx.x4=true;if(qs.get('award'))award2=qs.get('award');if(qs.get('hud'))hudStyle=qs.get('hud');if(qs.get('stagger'))stagger=qs.get('stagger');if(qs.get('bg'))bgStyle=qs.get('bg');if(qs.get('rep'))repStyle=qs.get('rep');if(qs.get('echo'))echo=qs.get('echo');if(qs.get('pass'))passStyle=qs.get('pass');if(qs.get('lead'))bounceLead=qs.get('lead');if(qs.get('shape'))bShape=qs.get('shape');if(qs.get('path'))bPath=qs.get('path');if(qs.get('polish'))for(const k of qs.get('polish').split(','))if(k==='all')for(const j in pol)pol[j]=true;else if(k in pol)pol[k]=true;if(qs.get('strings'))liveStyle=qs.get('strings');if(qs.get('misses'))fx.misses=true;if(qs.get('song'))song=Object.keys(PASSAGES)[+qs.get('song')];
load();show();requestAnimationFrame(frame);
