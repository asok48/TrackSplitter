<!doctype html>
<html lang="en">
<!-- The concert as a real 3D scene (user, 2026-11-06: "what would a webgl one look like?", after show.html; the drawn 2D
     versions kept reading as "flash game"). three.js 0.160 (the version the app keeps in static/vendor/three; from the CDN here
     like board-3d-prototype.html): a dark stage in fog, a truss of moving heads whose beams are glowing volumes (fading with
     length, soft at the edges, additive), each with a spot light pooling on a glossy floor; an LED wall; drifting haze lit by
     the rig; crowd silhouettes in front; bloom; a slowly swaying camera. The board is the game's, drawn sharp on a 2D canvas on
     top. Beat, big moments, streak and Encore as in show.html. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encore stage</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #020205; color: #f5f5f7; font: 500 13px -apple-system, "SF Pro Display", system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 12px 18px; z-index: 3; }
  #bar b { font-weight: 700; margin-right: 6px; }
  #bar button { background: none; border: 0; color: rgba(245,245,247,.55); font: inherit; padding: 4px 2px; cursor: pointer; }
  #bar button.on { color: #fff; box-shadow: 0 2px 0 #fff; }
  #bar .lab { color: rgba(245,245,247,.35); margin-left: 10px; }
  #bar input { width: 110px; accent-color: #fff; }
  #desc { position: fixed; left: 18px; right: 18px; bottom: 14px; color: rgba(245,245,247,.5); max-width: 960px; line-height: 1.5; z-index: 3; }
  #gl, #board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #board { z-index: 2; pointer-events: none; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="gl"></canvas><canvas id="board"></canvas>
<div id="bar"><b>Stage (WebGL)</b>
  <span class="lab">Lights</span><button data-rig="warm">Warm</button><button data-rig="cool">Cool</button><button data-rig="sunset">Sunset</button>
  <span class="lab">Streak</span><input type="range" id="streak" min="0" max="40" value="12"><span id="mult">2×</span>
  <button data-encore>Encore</button>
  <span class="lab">Stage</span><button data-crowd>Crowd</button><button data-board>Board</button>
  <button data-pause>Pause</button>
</div>
<div id="desc">A real 3D stage behind the board: beams from moving heads in fog, pooling light on a glossy floor, an LED wall, haze, a crowd in front, bloom. Pumps on the beat, fans out every 4 bars; drag Streak (more of the rig, blue at 4×), try Encore (gold). Space pauses.</div>

    const dir = new THREE.Vector3(0, -1, 0).applyEuler(h.g.rotation), k = h.g.position.y / Math.max(0.2, -dir.y);
    h.spot.target.position.set(h.g.position.x + dir.x * k, 0, h.g.position.z + dir.z * k); h.spot.color.copy(c); h.spot.intensity = 60 * lit * pump; h.spot.angle = 0.16 + 0.05 * lv.big;
  }
  // haze drifts, tinted by the wash
  const washC = tone(R0.wash);
  hazes.forEach((m, i) => { m.position.x += Math.sin(T * 0.05 + i) * dt * 0.3; m.material.color.copy(washC).multiplyScalar(0.25 + 0.25 * energy + 0.15 * kick); m.material.opacity = 0.18 + 0.12 * energy; m.lookAt(camera.position); });
  // the crowd
  crowd.visible = crowdOn;
  for (const p of people) { p.p.position.y = p.base + Math.abs(Math.sin(T * Math.PI / (beatLen * 2) + p.ph)) * 0.05 * (0.4 + lv.mult); if (p.arm) { const up = clamp01(lv.big * 1.4 + lv.enc + (lv.mult > 0.9 ? 0.4 : 0) - (p.ph % 1) * 0.5); p.arm.rotation.z = (p.arm.position.x > 0 ? -1 : 1) * (0.3 + (1 - up) * 2.4) + Math.sin(T * 3 + p.ph) * 0.15 * up; p.arm.position.y = 1.05 + 0.35 * up; } }
  bloom.strength = 0.55 + 0.3 * lv.big + 0.15 * lv.enc;
  composer.render();
  drawBoard(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
